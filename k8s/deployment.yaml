
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mp136-api

spec:
  replicas: 4

  selector:
    matchLabels:
      app: mp136-api

  template:
    metadata:
      labels:
        app: mp136-api

    spec:
      containers:
        - name: mp136-api
          image: mp136-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
